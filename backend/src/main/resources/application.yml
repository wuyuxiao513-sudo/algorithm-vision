server:
  port: ${SERVER_PORT:8800}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/data_structure?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

file:
  upload:
    path: ${UPLOAD_PATH:${user.home}/data_structure_uploads}
    access-url: ${UPLOAD_ACCESS_URL:http://localhost:${server.port}/files}

langchain4j:
  anthropic:
    api-key: ${MODEL_API_KEY:}
    base-url: ${MODEL_BASE_URL:}
    chat-model:
      model-name: ${MODEL_NAME:mimo-v2.5}
    streaming-chat-model:
      model-name: ${MODEL_NAME:mimo-v2.5}
